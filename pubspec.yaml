name: wirdan_spike
description: "اختبار جدوى مكتبات WIRDAN على Windows (مشروع مؤقت يُحذف بعد نجاح الاختبار)"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  local_notifier: ^0.1.6
  window_manager: '>=0.5.0 <0.6.0'
  tray_manager: '>=0.5.0 <0.6.0'
  launch_at_startup: '>=0.3.0 <1.0.0'
  windows_single_instance: ^1.0.1
  drift: ^2.20.0
  drift_flutter: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/tray_icon.ico
